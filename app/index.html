
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CloudNexus | Cloud Platform</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
    }

    header {
      padding: 24px 8%;
      border-bottom: 1px solid #334155;
      font-size: 22px;
      font-weight: bold;
      color: #38bdf8;
    }

    main {
      max-width: 900px;
      margin: 90px auto;
      padding: 24px;
      text-align: center;
    }

    h1 {
      font-size: clamp(32px, 5vw, 52px);
      margin-bottom: 16px;
    }

    h1 span { color: #38bdf8; }

    p {
      color: #94a3b8;
      line-height: 1.7;
    }

    .status {
      display: inline-block;
      margin-top: 24px;
      padding: 12px 18px;
      border: 1px solid #166534;
      border-radius: 24px;
      background: #14532d33;
      color: #86efac;
    }

    footer {
      margin-top: 70px;
      color: #64748b;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <header>CloudNexus</header>

  <main>
    <h1>Modern Cloud Applications, <span>Made Simple.</span></h1>
    <p>
      A cloud-native application platform built with Docker,
      Amazon ECR, Kubernetes, and Amazon EKS.
    </p>

    <div class="status">● Application Ready</div>

    <footer>CloudNexus DevOps Portfolio Project</footer>
  </main>
</body>
</html>
